apiVersion: v1
kind: Service
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # The APIService always talks to port 443 on the Service; the pod listens
    # on an unprivileged port behind it.
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "cert-manager-webhook-arvan.selectorLabels" . | nindent 4 }}
