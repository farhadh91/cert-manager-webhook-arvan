{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cert-manager-webhook-arvan.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The kube-apiserver resolves the Service to an endpoint and connects
    # straight to the pod ip to serve the aggregated api. Without this, a
    # cluster with a default-deny policy drops that traffic and the APIService
    # reports MissingEndpoints and then FailedDiscoveryCheck, even though the
    # pod is healthy.
    #
    # No `from` selector: the connection originates from the control plane's
    # host network, which no namespace or pod selector matches under
    # OVN-Kubernetes. Only this one port is opened.
    - ports:
        - port: {{ .Values.securePort }}
          protocol: TCP
{{- end }}
