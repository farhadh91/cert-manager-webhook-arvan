apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}

---
# Read the ConfigMap holding the apiserver's requestheader CA, so the webhook
# can authenticate incoming requests.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-arvan.fullname" . }}
    namespace: {{ .Release.Namespace }}

---
# Delegate authn/authz decisions to the core apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:auth-delegator
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-arvan.fullname" . }}
    namespace: {{ .Release.Namespace }}

---
# Let cert-manager call this webhook's API group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:domain-solver
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:domain-solver
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}

---
# The webhook reads the ArvanCloud api key and its own serving certificate,
# and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:secret-reader
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.credentialsSecretRef | quote }}
      - {{ include "cert-manager-webhook-arvan.servingCertificate" . | quote }}
    verbs: ["get", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:secret-reader
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "cert-manager-webhook-arvan.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cert-manager-webhook-arvan.fullname" . }}:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "cert-manager-webhook-arvan.fullname" . }}
    namespace: {{ .Release.Namespace | quote }}
